services:
  orchestrator-api:
    build: ./orchestrator-api
    ports:
      - "8000:8000"
    environment:
      MOCK_MODE: "false"
      DOC_PROCESSOR_URL: http://doc-processor-api:8001
      RETRIEVAL_SERVICE_URL: http://retrieval-api:8002
      AGENT_SERVICE_URL: http://agent-service:8003
      VALIDATOR_SERVICE_URL: http://answer-validator-api:8004
      DOCUMENT_STORE_DIR: /data/documents
      REVIEW_STORE_PATH: /data/documents/reviews.jsonl
    volumes:
      - source-documents:/data/documents
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      doc-processor-api:
        condition: service_healthy
      retrieval-api:
        condition: service_healthy
      agent-service:
        condition: service_healthy
      answer-validator-api:
        condition: service_healthy

  doc-processor-api:
    build: ./doc-processor-api
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s

  retrieval-api:
    build: ./retrieval-api
    ports:
      - "8002:8002"
    environment:
      LEDGER_RETRIEVAL_PORT: "8002"
      LEDGER_RETRIEVAL_DATA_DIR: /data
      EVAL_SERVICE_URL: http://eval-service:8005
    volumes:
      - retrieval-data:/data
      - model-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s
    depends_on:
      eval-service:
        condition: service_healthy

  agent-service:
    build: ./agent-service
    ports:
      - "8003:8003"
    environment:
      # Defaults keep the stack runnable with no .env. A local .env next to
      # this file (gitignored) switches on the real model and supplies keys.
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
      ANTHROPIC_MAX_RETRIES: ${ANTHROPIC_MAX_RETRIES:-8}
      ANTHROPIC_MAX_TOKENS: ${ANTHROPIC_MAX_TOKENS:-16000}
      ANTHROPIC_EFFORT: ${ANTHROPIC_EFFORT:-}
      # No colon: an explicitly empty value disables fallbacks.
      ANTHROPIC_FALLBACKS: ${ANTHROPIC_FALLBACKS-default}
      RETRIEVAL_API_URL: http://retrieval-api:8002
      RETRIEVAL_FALLBACK_TO_MOCK: "false"
      TOP_K_FINAL: ${TOP_K_FINAL:-5}
      GRADE_REQUIRE_ENTITY_MATCH: ${GRADE_REQUIRE_ENTITY_MATCH:-true}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      retrieval-api:
        condition: service_healthy

  answer-validator-api:
    build: ./answer-validator-api
    ports:
      - "8004:8004"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  eval-service:
    build: ./eval-service
    ports:
      - "8005:8005"
    environment:
      # Empty keys leave tracing local-only, exactly as before.
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      # Langfuse's setup snippet names this LANGFUSE_BASE_URL; accept either.
      LANGFUSE_HOST: ${LANGFUSE_HOST:-${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ui-service:
    build: ./ui-service
    ports:
      - "7860:7860"
    environment:
      ORCHESTRATOR_URL: http://orchestrator-api:8000
      MOCK_MODE: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      orchestrator-api:
        condition: service_healthy

volumes:
  retrieval-data:
  model-cache:
  source-documents:
